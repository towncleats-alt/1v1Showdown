# railway.toml — Railway.app deployment config
# https://docs.railway.app/reference/config-as-code
#
# Railway gives you free Node.js hosting with no credit card required.
# Database is hosted on Neon.tech (free Postgres, also no card required).
#
# See README.md for the full step-by-step deployment guide.

[build]
builder = "nixpacks"
buildCommand = "npm install --production=false"

[deploy]
startCommand = "node backend/start.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
